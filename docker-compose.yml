services:
  web:
    image: nginx:1.27-alpine
    container_name: nginx-static-poc
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped